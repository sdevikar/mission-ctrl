[project]
name = "mission_ctrl_core"
version = "0.1.0"
description = "Pure Python intent-layer library for Mission Ctrl"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mission_ctrl_core"]

[tool.hatch.build.targets.sdist]
include = ["mission_ctrl_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
